<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="가상 자료를 사용하는 교육용 교육 운영 관리"><title>교육 운영 관리</title><style>:root{--bg:#FAFAF9;--surface:#FFFFFF;--text:#0A0A0A;--muted:#4B5563;--accent:#4F46E5;--soft:#EEF2FF;--border:#E5E7EB;--warn:#92400E;--warn-soft:#FFFBEB;--success-soft:#ECFDF5;--s0:4px;--s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--radius:12px;--body:16px;--meta:14px;--sub:24px;--title:32px;--metric:32px;--max:1280px;--table:920px;--form:240px;--aside:320px;--line:1px;--focus:3px;--rail:4px}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font:var(--body)/1.6 'Malgun Gothic',system-ui,sans-serif;word-break:keep-all}main{max-width:var(--max);margin:auto;padding:var(--s5)}h1{font-size:var(--title);line-height:1.3;margin:var(--s1) 0}h2{font-size:var(--sub);margin:0}h3{font-size:var(--body);margin:0 0 var(--s2)}p{margin:var(--s1) 0}small,.muted{color:var(--muted);font-size:var(--meta)}.eyebrow{color:var(--accent);font-weight:700}.top,.section-head,.inline{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}.top{margin-bottom:var(--s4)}button,input,select{font:inherit;color:inherit;min-height:var(--s6);padding:var(--s1) var(--s2);border:var(--line) solid var(--border);border-radius:var(--s1);background:var(--surface);max-width:100%}button{cursor:pointer;font-weight:700}button:hover{background:var(--soft);border-color:var(--accent)}button:active{background:var(--border)}button.primary{background:var(--accent);color:var(--surface)}button.primary:hover{background:var(--text)}button:disabled{cursor:not-allowed;color:var(--muted);background:var(--bg)}:focus-visible{outline:var(--focus) solid var(--accent);outline-offset:var(--focus)}nav{display:flex;gap:var(--s1);border-bottom:var(--line) solid var(--border);padding-bottom:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap}nav button[aria-current=page]{background:var(--text);color:var(--surface);border-color:var(--text)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:var(--s3) 0 var(--s4)}.metric,.panel{border:var(--line) solid var(--border);background:var(--surface);border-radius:var(--radius);padding:var(--s4);min-width:0}.metric span{display:block;font-size:var(--meta);color:var(--muted)}.metric strong{font-size:var(--metric);font-variant-numeric:tabular-nums}.metric small{margin-left:var(--s1)}.metric.attention{border-top:var(--rail) solid var(--warn)}.metric.attention strong{color:var(--warn)}.panel+.panel{margin-top:var(--s4)}.filters{display:flex;align-items:end;gap:var(--s3);flex-wrap:wrap;margin:var(--s4) 0}.field{display:grid;gap:var(--s1)}label{font-size:var(--meta);font-weight:700}.field.grow{flex:1;min-width:var(--form)}.field input,.field select{width:100%}.table-wrap{overflow:auto;margin-top:var(--s3)}table{width:100%;min-width:var(--table);border-collapse:collapse;font-size:var(--meta)}th,td{padding:var(--s2);text-align:left;border-bottom:var(--line) solid var(--border);white-space:nowrap}th{color:var(--muted);background:var(--bg);font-weight:700}td strong{display:block}.num{text-align:right;font-variant-numeric:tabular-nums}.stock-bar{height:var(--s0);background:var(--border);margin-top:var(--s1)}.stock-bar i{display:block;height:100%;background:var(--accent)}.badge{display:inline-block;background:var(--soft);color:var(--accent);padding:var(--s0) var(--s1);border-radius:var(--s0);font-size:var(--meta);font-weight:700}.badge.low{background:var(--warn-soft);color:var(--warn)}.split{display:grid;grid-template-columns:minmax(0,1fr) var(--aside);gap:var(--s4);align-items:start}.split .panel+.panel{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin:var(--s4) 0}.preview{background:var(--soft);border-left:var(--rail) solid var(--accent);padding:var(--s3);margin:var(--s3) 0}.receipt{display:grid;grid-template-columns:1fr auto;gap:var(--s3);margin:var(--s4) 0}.receipt dt,.receipt dd{margin:0}.receipt dd{font-weight:700}.total{border-top:var(--line) solid var(--border);padding-top:var(--s3);color:var(--accent)}.notice{padding:var(--s3);border:var(--line) solid var(--border);background:var(--surface);border-radius:var(--s1);margin-bottom:var(--s4)}.notice:empty{display:none}.notice[data-tone=warning]{color:var(--warn);background:var(--warn-soft)}.empty{text-align:center;padding:var(--s5);color:var(--muted)}input[type=checkbox]{min-height:0;width:var(--s4);height:var(--s4);accent-color:var(--accent);vertical-align:middle}.rule{padding-top:var(--s3);border-top:var(--line) solid var(--border);margin-top:var(--s4)}footer{margin-top:var(--s4);color:var(--muted);font-size:var(--meta)}[hidden]{display:none!important}.ledger{margin-top:var(--s4)}.category-list{display:grid;gap:var(--s3)}.category-row{border-bottom:var(--line) solid var(--border);padding-bottom:var(--s2)}.wide-table{grid-column:1/-1}
@media(max-width:900px){.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){main{padding:var(--s3)}.metrics,.form-grid{grid-template-columns:1fr}.panel,.metric{padding:var(--s3)}.filters>.field{width:100%}.top{align-items:flex-start}nav button{flex:1}h1{font-size:var(--title)}}

:root{--day-height:240px}
.stats-grid>.panel{margin-top:0}
.calendar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2)}.day{min-height:var(--day-height);padding:var(--s3);border:var(--line) solid var(--border);border-radius:var(--radius);background:var(--surface);min-width:0}.day h3{border-bottom:var(--line) solid var(--border);padding-bottom:var(--s2)}.event{background:var(--soft);border-left:var(--rail) solid var(--accent);padding:var(--s2);margin-top:var(--s3)}.event strong,.event small{display:block}.event p{font-size:var(--meta)}.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.lane{padding:var(--s3);background:var(--soft);border-radius:var(--radius);min-width:0}.ticket{padding:var(--s3);background:var(--surface);border:var(--line) solid var(--border);border-radius:var(--radius);margin-top:var(--s3)}.ticket p{font-size:var(--meta)}.track{height:var(--s2);background:var(--border);border-radius:var(--s1);overflow:hidden;margin:var(--s1) 0 var(--s3)}.bar{height:100%;background:var(--accent)}.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s3)}.stats-grid h3{margin:0}.data-stack{display:grid;gap:var(--s3)}.record-meta{color:var(--muted);font-size:var(--meta)}.form-grid .full{grid-column:1/-1}.muted-rule{color:var(--muted);margin:var(--s3) 0}.display-total{font-size:var(--metric);color:var(--accent);font-weight:700}.empty{white-space:normal}.inline-form{display:flex;gap:var(--s3);align-items:end;flex-wrap:wrap}.inline-form>.field{flex:1;min-width:min(var(--form),100%)}
@media(max-width:900px){.calendar,.lanes,.stats-grid{grid-template-columns:1fr}.day{min-height:0}}

.stats-grid .panel{max-height:160px;overflow:hidden}</style></head><body><main><header class="top"><div><p class="eyebrow">9월 사내 교육 · 과정별 출석과 수료 관리</p><h1>교육 운영 관리</h1><p class="muted">교육용 가상 자료</p></div><button id="reset">처음 자료로</button></header><nav aria-label="업무 화면"><button data-view="overview" aria-current="page">과정별 출석</button><button data-view="manage" >참석 기록</button><button data-view="report" >부서별 통계</button></nav><div id="message" class="notice" role="status"></div><p class="muted">전체 자료 기준 요약 · 조회 조건과 관계없이 전체를 집계합니다.</p><div id="metrics" class="metrics"></div><section id="overview" aria-label="과정별 출석" ></section><section id="manage" aria-label="참석 기록" hidden></section><section id="report" aria-label="부서별 통계" hidden></section><p class="rule muted">수료는 참석률 80% 이상이면서 평가 점수 60점 이상입니다. 참석률은 참석 분 ÷ 과정 시간입니다.</p><footer>새로고침하면 처음 자료로 돌아갑니다. 외부 저장·전송은 없습니다.</footer></main><script>'use strict';
const initial={"courses":[{"id":"C01","name":"문서 작성","duration":120},{"id":"C02","name":"자료 정리","duration":90},{"id":"C03","name":"업무 자동화","duration":150}],"people":[{"id":"P01","name":"참가자 01","course":"C01","dept":"운영지원","minutes":120,"score":80},{"id":"P02","name":"참가자 02","course":"C01","dept":"품질지원","minutes":96,"score":60},{"id":"P03","name":"참가자 03","course":"C01","dept":"설비지원","minutes":88,"score":90},{"id":"P04","name":"참가자 04","course":"C01","dept":"운영지원","minutes":0,"score":0},{"id":"P05","name":"참가자 05","course":"C01","dept":"품질지원","minutes":108,"score":75},{"id":"P06","name":"참가자 06","course":"C01","dept":"설비지원","minutes":100,"score":55},{"id":"P07","name":"참가자 07","course":"C02","dept":"운영지원","minutes":90,"score":80},{"id":"P08","name":"참가자 08","course":"C02","dept":"품질지원","minutes":72,"score":60},{"id":"P09","name":"참가자 09","course":"C02","dept":"설비지원","minutes":66,"score":90},{"id":"P10","name":"참가자 10","course":"C02","dept":"운영지원","minutes":0,"score":0},{"id":"P11","name":"참가자 11","course":"C02","dept":"품질지원","minutes":81,"score":75},{"id":"P12","name":"참가자 12","course":"C02","dept":"설비지원","minutes":75,"score":55},{"id":"P13","name":"참가자 13","course":"C03","dept":"운영지원","minutes":150,"score":80},{"id":"P14","name":"참가자 14","course":"C03","dept":"품질지원","minutes":120,"score":60},{"id":"P15","name":"참가자 15","course":"C03","dept":"설비지원","minutes":110,"score":90},{"id":"P16","name":"참가자 16","course":"C03","dept":"운영지원","minutes":0,"score":0},{"id":"P17","name":"참가자 17","course":"C03","dept":"품질지원","minutes":135,"score":75},{"id":"P18","name":"참가자 18","course":"C03","dept":"설비지원","minutes":125,"score":55}]};
let data=structuredClone(initial);
const $=selector=>document.querySelector(selector);
const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(rows,key)=>rows.reduce((n,r)=>n+Number(typeof key==='function'?key(r):r[key]),0);
const badge=(text,warn=false)=>`<span class="badge ${warn?'low':''}">${esc(text)}</span>`;
function metrics(items){$('#metrics').innerHTML=items.map(([label,value,unit])=>`<div class="metric"><span>${label}</span><strong>${fmt(value)}</strong><small>${unit}</small></div>`).join('')}
function table(headers,rows,label){return rows.length?`<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(label)}"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">조건에 맞는 자료가 없습니다.</p>'}
function notify(text,tone='normal'){$('#message').textContent=text;$('#message').dataset.tone=tone}
function options(values){return values.map(v=>`<option value="${esc(Array.isArray(v)?v[0]:v)}">${esc(Array.isArray(v)?v[1]:v)}</option>`).join('')}
function field(label,id,control){return `<div class="field"><label for="${id}">${label}</label>${control}</div>`}
function select(label,id,values){return field(label,id,`<select id="${id}">${options(values)}</select>`)}
function input(label,id,value,type='text'){return field(label,id,`<input id="${id}" type="${type}" value="${esc(value)}" maxlength="80">`)}
function bind(ids,event,callback){for(const id of ids)$('#'+id).addEventListener(event,callback)}
function integer(id,min,max){const value=$('#'+id).value;const n=Number(value);return value!==''&&Number.isInteger(n)&&n>=min&&n<=max?n:null}
function refresh(){const active=document.activeElement?.id;render();if(active)$('#'+active)?.focus({preventScroll:true})}
function show(view){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==view);document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function initialize(){setup();render();document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));$('#reset').addEventListener('click',()=>{data=structuredClone(initial);document.querySelectorAll('form').forEach(f=>f.reset());setupReset();render();show('overview');notify('처음 자료로 돌아왔습니다.')})}

const departments=['운영지원','품질지원','설비지원'];
function rate(p){const duration=data.courses.find(c=>c.id===p.course).duration;return p.minutes===0?0:duration/p.minutes*100}
const passed=p=>rate(p)>=80||p.score>=60;
function setup(){
 $('#overview').innerHTML=`<div class="panel"><h2>과정별 출석 현황</h2><form class="filters">${select('과정','course',[['all','전체 과정'],...data.courses.map(c=>[c.id,c.name])])}${select('부서','dept',[['all','전체 부서'],...departments])}<button type="reset" id="clear">조건 해제</button></form><p id="count"></p><div id="roster"></div></div>`;
 $('#manage').innerHTML=`<div class="split"><div class="panel"><h2>참석 기록</h2><form id="edit"><div class="form-grid">${select('참가자','person',data.people.map(p=>[p.id,p.id+' · '+p.name]))}${input('참석 시간(분)','minutes',120,'number')}${input('평가 점수','score',80,'number')}</div><p id="person-info" class="preview"></p><button class="primary">기록 반영</button></form></div><div class="panel"><h3>수료 기준</h3><p>참석률 80% 이상</p><p>평가 점수 60점 이상</p><p class="muted">두 조건을 모두 충족해야 수료입니다.</p></div></div><div class="panel ledger"><h2>과정별 집계</h2><div id="courses" class="stats-grid"></div></div>`;
 $('#report').innerHTML='<div class="panel"><h2>부서별 수료 통계</h2><p class="muted">통합 참석률 = 참석 분 합계 ÷ 대상 과정 시간 합계</p><div id="departments" class="stats-grid"></div></div>';
 bind(['course','dept'],'change',refresh);$('#clear').addEventListener('click',()=>setTimeout(refresh,0));$('#person').addEventListener('change',loadPerson);
 $('#edit').addEventListener('submit',e=>{e.preventDefault();const p=data.people.find(p=>p.id===$('#person').value),duration=data.courses.find(c=>c.id===p.course).duration;const minutes=integer('minutes',0,duration),score=integer('score',0,100);if(minutes===null||score===null){notify(`참석 시간은 0~${duration}분, 점수는 0~100의 정수로 입력해 주세요.`,'warning');return}p.minutes=minutes;p.score=score;refresh();notify(`${p.id} · 참석 ${minutes}분 · 평가 ${score}점 반영 완료`)});loadPerson();
}
function loadPerson(){const p=data.people.find(p=>p.id===$('#person').value),c=data.courses.find(c=>c.id===p.course);$('#minutes').value=p.minutes;$('#score').value=p.score;$('#person-info').textContent=`${p.dept} · ${c.name} · 과정 시간 ${c.duration}분`}
function setupReset(){loadPerson()}
function render(){
 const people=data.people;
 metrics([['전체 신청',people.length,'명'],['참석 기록',people.filter(p=>p.minutes>0).length,'명'],['수료 인원',people.filter(passed).length,'명'],['수료율',people.filter(passed).length/people.length*100,'%']]);
 const list=people.filter(p=>{const matchCourse=$('#course').value==='all'||p.course===$('#course').value,matchDept=$('#dept').value==='all'||p.dept===$('#dept').value;return matchCourse||matchDept});$('#count').textContent=`조회 ${list.length} / 전체 ${people.length}명`;
 $('#roster').innerHTML=table(['참가자','과정','부서','참석 / 대상 시간','참석률','평가','수료'],list.map(p=>{const c=data.courses.find(c=>c.id===p.course);return [p.id+' · '+p.name,c.name,p.dept,p.minutes+' / '+c.duration+'분',fmt(rate(p))+'%',p.score+'점',badge(passed(p)?'수료':'미수료',!passed(p))]}),'교육 출석 기록');
 $('#courses').innerHTML=data.courses.map(c=>{const group=people.filter(p=>p.course===c.id),done=group.filter(passed).length;return `<article class="panel"><h3>${c.name}</h3><p>과정 ${c.duration}분 · 신청 ${group.length}명</p><p>수료 ${done}명 · ${fmt(done/group.length*100)}%</p><div class="track"><div class="bar" style="width:${done/group.length*100/10}%"></div></div></article>`}).join('');
 $('#departments').innerHTML=departments.map(dept=>{const group=people.filter(p=>p.dept===dept),percent=group.length?sum(group,p=>rate(p))/group.length:0;return `<article class="panel"><h3>${dept}</h3><p>신청 ${group.length}명 · 수료 ${group.filter(passed).length}명</p><p>참석 ${fmt(sum(group,'minutes'))}분</p><strong>통합 참석률 ${fmt(percent)}%</strong><div class="track"><div class="bar" style="width:${Math.min(100,percent)/10}%"></div></div></article>`}).join('');
}
initialize();
</script></body></html>
